<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team02Board</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Team02Board</h1><p>チームで育てる小さなWebアプリ</p><form id="form"><input id="name" maxlength="30" placeholder="Nickname" required><p id="name-count">0 / 30</p><textarea id="message" maxlength="300" placeholder="Message" required></textarea><p id="message-count">0 / 300</p><label for="color">文字色:</label><select id="color"><option value="black">Black</option><option value="red">Red</option><option value="blue">Blue</option></select><label for="font">フォント:</label><select id="font"><option value="sans-serif">標準</option><option value="serif">明朝体</option><option value="monospace">等幅</option><option value="cursive">筆記体</option><option value="random">ランダム</option></select><button>投稿</button></form><p id="status"></p><section id="messages"></section></main><script src="/static/app.js"></script></body></html>
